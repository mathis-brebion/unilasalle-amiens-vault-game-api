spring.application.name=vault-game-api
server.port=${SERVER_PORT:8080}

# Use dev profile by default for development runs.
# Production/staging should set SPRING_PROFILES_ACTIVE explicitly.
spring.profiles.default=dev

# Default local DB config for a MySQL-compatible container; override with env vars if needed.
# Load .env even when no Spring profile is active.
spring.config.import=optional:file:.env[.properties]

# MySQL 8 auth in local containers may require public key retrieval when SSL is disabled.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vault_game}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:CHANGE_ME_DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# In dev, prefer update to avoid drop/create cycles at each startup.
# Override with DDL_AUTO when you need create/create-drop for a reset.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# Optional SQL visibility for debugging schema/data issues.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Disabled by default; enabled only in the dev profile.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
