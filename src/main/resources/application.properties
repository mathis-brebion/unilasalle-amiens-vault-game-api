spring.application.name=vault-game-api
server.port=${SERVER_PORT:8080}

# Default local DB config for a MySQL-compatible container; override with env vars if needed.
# Load .env even when no Spring profile is active.
spring.config.import=optional:file:.env[.properties]

# MySQL 8 auth in local containers may require public key retrieval when SSL is disabled.
spring.datasource.url=${DB_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vault_game}?allowPublicKeyRetrieval=true&sslMode=DISABLED}
spring.datasource.username=${DB_USERNAME:CHANGE_ME_DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
