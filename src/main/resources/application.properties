spring.application.name=vault-game-api

# Default local DB config for a MySQL-compatible container; override with env vars if needed.
spring.datasource.url=${DB_URL:jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vault_game}}
spring.datasource.username=${DB_USERNAME:CHANGE_ME_DB_USERNAME}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME_DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
